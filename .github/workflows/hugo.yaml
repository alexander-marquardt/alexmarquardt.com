name: Deploy Hugo site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.153.4"
          extended: true

      - name: Build
        run: hugo --minify

      # An empty listing is not a build failure. The asset pages are built by
      # walking the filesystem inside a template, and a template that walks it
      # wrongly returns an empty slice: the page renders "No images in this
      # directory yet.", `hugo` exits 0, and the deploy publishes it. That has
      # happened twice -- once from reading Hugo's page tree, where a top-level
      # section is a `term` on the version pinned above and a `term` has no
      # `.Pages`; once from reading one directory level for images filed in
      # subdirectories. Neither shows up in a build log, and both show up in
      # one number, so the number is checked on the BUILT output before it is
      # uploaded.
      - name: Verify the rendered listings against the files on disk
        run: python3 scripts/verify_rendered_listings.py

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
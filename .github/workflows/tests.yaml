name: Tests

# The listing gate: the built pages must list exactly the image files on disk.
# It runs here as well as on the deploy. On the deploy alone it reports an
# empty listing AFTER the empty listing is live, which is the wrong end of the
# publish to find out.

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  listings:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read the pinned Hugo version
        id: hugo
        run: echo "version=$(cat .hugo-version)" >> "$GITHUB_OUTPUT"

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ steps.hugo.outputs.version }}
          extended: true

      - name: Build
        run: hugo --minify

      - name: Verify the rendered listings against the files on disk
        run: python3 scripts/verify_rendered_listings.py

name: Tests

# The site's own build is not what these guard. They cover the seam between
# this repository and the catalog generator that feeds it: the importer reading
# a manifest the generator writes. Both sides had passing tests while the
# publish failed on the first row, because each tested its own assumption about
# the other's shape, so the seam is tested here against the generator's real
# output.

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest

      # pngquant is packaged; oxipng is not in Ubuntu's repositories, so it
      # comes from its own release. Both are needed: without them the
      # end-to-end importer tests skip themselves, which would leave this job
      # green while testing none of the seam it exists for.
      - name: Install pngquant
        run: sudo apt-get update && sudo apt-get install -y pngquant

      - name: Install oxipng
        env:
          OXIPNG_VERSION: "10.2.1"
        run: |
          set -euo pipefail
          asset="oxipng-${OXIPNG_VERSION}-x86_64-unknown-linux-musl"
          curl -fsSL -o /tmp/oxipng.tar.gz \
            "https://github.com/shssoichiro/oxipng/releases/download/v${OXIPNG_VERSION}/${asset}.tar.gz"
          tar -xzf /tmp/oxipng.tar.gz -C /tmp
          sudo install -m 0755 "/tmp/${asset}/oxipng" /usr/local/bin/oxipng
          oxipng --version

      - name: Fail if the compression tools are missing
        run: command -v pngquant && command -v oxipng

      - name: Run tests
        run: python -m pytest tests/ -v

      # The listing gate runs here as well as on the deploy. On the deploy
      # alone it reports an empty listing AFTER the empty listing is live,
      # which is the wrong end of the publish to find out.
      - name: Read the pinned Hugo version
        id: hugo
        run: echo "version=$(cat .hugo-version)" >> "$GITHUB_OUTPUT"

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ steps.hugo.outputs.version }}
          extended: true

      - name: Build
        run: hugo --minify

      - name: Verify the rendered listings against the files on disk
        run: python3 scripts/verify_rendered_listings.py

<svg xmlns="http://www.w3.org/2000/svg" width="900" height="416" viewBox="0 0 900 416" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Inside one call the model writes its response one token at a time, each predicted from the input plus the tokens already written"><defs><marker id="ah5f9f5f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5f9f5f"/></marker><marker id="ah5b6770" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5b6770"/></marker><marker id="ahe0712c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#e0712c"/></marker><marker id="ah1f2933" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1f2933"/></marker></defs><rect width="900" height="416" fill="#fbfaf7"/><text x="30.0" y="34.0" font-size="18" font-weight="600" fill="#1f2933" text-anchor="start" >Inside one call: the model writes its response one token at a time</text><text x="30.0" y="56.0" font-size="13" font-weight="normal" fill="#5b6770" text-anchor="start" >A token is a word or a piece of a word. Each new token is predicted from everything before it:</text><text x="30.0" y="74.0" font-size="13" font-weight="normal" fill="#5b6770" text-anchor="start" >what the agent sent, plus the tokens the model has already written.</text><text x="30.0" y="119.0" font-size="12" font-weight="600" fill="#5b6770" text-anchor="start" >step 1</text><rect x="90.0" y="96.0" width="370.0" height="36.0" rx="4" fill="#d6e6f5" stroke="#7ea6cc" stroke-width="1"/><text x="100.0" y="111.0" font-size="11" font-weight="normal" fill="#5b6770" text-anchor="start" >System prompt + tool list</text><text x="100.0" y="126.0" font-size="12" font-weight="600" fill="#1f2933" text-anchor="start" >You: “The test in test_cart.py fails. Fix it.”</text><path d="M467 114 H692" fill="none" stroke="#1f2933" stroke-width="1.5" marker-end="url(#ah1f2933)"/><text x="582.0" y="108.0" font-size="10" font-weight="normal" fill="#5b6770" text-anchor="middle" >predict next token</text><rect x="700.0" y="96.0" width="42.0" height="36.0" rx="4" fill="#e0712c" stroke="none" stroke-width="1"/><text x="721.0" y="119.0" font-size="13" font-weight="600" fill="#fff" text-anchor="middle" >Let</text><path d="M721.0 134 C 721.0 144, 485.0 126, 485.0 147" fill="none" stroke="#e0712c" stroke-width="1.4" marker-end="url(#ahe0712c)"/><text x="752.0" y="111.0" font-size="12" font-weight="600" fill="#e0712c" text-anchor="start" >new token,</text><text x="752.0" y="126.0" font-size="12" font-weight="normal" fill="#e0712c" text-anchor="start" >added to the input</text><text x="30.0" y="173.0" font-size="12" font-weight="600" fill="#5b6770" text-anchor="start" >step 2</text><rect x="90.0" y="150.0" width="370.0" height="36.0" rx="4" fill="#d6e6f5" stroke="#7ea6cc" stroke-width="1"/><text x="100.0" y="165.0" font-size="11" font-weight="normal" fill="#5b6770" text-anchor="start" >System prompt + tool list</text><text x="100.0" y="180.0" font-size="12" font-weight="600" fill="#1f2933" text-anchor="start" >You: “The test in test_cart.py fails. Fix it.”</text><rect x="464.0" y="150.0" width="42.0" height="36.0" rx="4" fill="#f6d3bd" stroke="#e0712c" stroke-width="1"/><text x="485.0" y="173.0" font-size="12" font-weight="600" fill="#e0712c" text-anchor="middle" >Let</text><path d="M512 168 H692" fill="none" stroke="#1f2933" stroke-width="1.5" marker-end="url(#ah1f2933)"/><text x="604.5" y="162.0" font-size="10" font-weight="normal" fill="#5b6770" text-anchor="middle" >predict next token</text><rect x="700.0" y="150.0" width="34.0" height="36.0" rx="4" fill="#e0712c" stroke="none" stroke-width="1"/><text x="717.0" y="173.0" font-size="13" font-weight="600" fill="#fff" text-anchor="middle" >me</text><path d="M717.0 188 C 717.0 198, 526.0 180, 526.0 201" fill="none" stroke="#e0712c" stroke-width="1.4" marker-end="url(#ahe0712c)"/><text x="30.0" y="227.0" font-size="12" font-weight="600" fill="#5b6770" text-anchor="start" >step 3</text><rect x="90.0" y="204.0" width="370.0" height="36.0" rx="4" fill="#d6e6f5" stroke="#7ea6cc" stroke-width="1"/><text x="100.0" y="219.0" font-size="11" font-weight="normal" fill="#5b6770" text-anchor="start" >System prompt + tool list</text><text x="100.0" y="234.0" font-size="12" font-weight="600" fill="#1f2933" text-anchor="start" >You: “The test in test_cart.py fails. Fix it.”</text><rect x="464.0" y="204.0" width="42.0" height="36.0" rx="4" fill="#f6d3bd" stroke="#e0712c" stroke-width="1"/><text x="485.0" y="227.0" font-size="12" font-weight="600" fill="#e0712c" text-anchor="middle" >Let</text><rect x="509.0" y="204.0" width="34.0" height="36.0" rx="4" fill="#f6d3bd" stroke="#e0712c" stroke-width="1"/><text x="526.0" y="227.0" font-size="12" font-weight="600" fill="#e0712c" text-anchor="middle" >me</text><path d="M549 222 H692" fill="none" stroke="#1f2933" stroke-width="1.5" marker-end="url(#ah1f2933)"/><text x="623.0" y="216.0" font-size="10" font-weight="normal" fill="#5b6770" text-anchor="middle" >predict next token</text><rect x="700.0" y="204.0" width="50.0" height="36.0" rx="4" fill="#e0712c" stroke="none" stroke-width="1"/><text x="725.0" y="227.0" font-size="13" font-weight="600" fill="#fff" text-anchor="middle" >read</text><path d="M725.0 242 C 725.0 252, 571.0 234, 571.0 255" fill="none" stroke="#e0712c" stroke-width="1.4" marker-end="url(#ahe0712c)"/><text x="30.0" y="281.0" font-size="12" font-weight="600" fill="#5b6770" text-anchor="start" >step 4</text><rect x="90.0" y="258.0" width="370.0" height="36.0" rx="4" fill="#d6e6f5" stroke="#7ea6cc" stroke-width="1"/><text x="100.0" y="273.0" font-size="11" font-weight="normal" fill="#5b6770" text-anchor="start" >System prompt + tool list</text><text x="100.0" y="288.0" font-size="12" font-weight="600" fill="#1f2933" text-anchor="start" >You: “The test in test_cart.py fails. Fix it.”</text><rect x="464.0" y="258.0" width="42.0" height="36.0" rx="4" fill="#f6d3bd" stroke="#e0712c" stroke-width="1"/><text x="485.0" y="281.0" font-size="12" font-weight="600" fill="#e0712c" text-anchor="middle" >Let</text><rect x="509.0" y="258.0" width="34.0" height="36.0" rx="4" fill="#f6d3bd" stroke="#e0712c" stroke-width="1"/><text x="526.0" y="281.0" font-size="12" font-weight="600" fill="#e0712c" text-anchor="middle" >me</text><rect x="546.0" y="258.0" width="50.0" height="36.0" rx="4" fill="#f6d3bd" stroke="#e0712c" stroke-width="1"/><text x="571.0" y="281.0" font-size="12" font-weight="600" fill="#e0712c" text-anchor="middle" >read</text><path d="M602 276 H692" fill="none" stroke="#1f2933" stroke-width="1.5" marker-end="url(#ah1f2933)"/><text x="649.5" y="270.0" font-size="10" font-weight="normal" fill="#5b6770" text-anchor="middle" >predict next token</text><rect x="700.0" y="258.0" width="74.0" height="36.0" rx="4" fill="#e0712c" stroke="none" stroke-width="1"/><text x="737.0" y="281.0" font-size="13" font-weight="600" fill="#fff" text-anchor="middle" >cart.py</text><text x="30.0" y="316.0" font-size="13" font-weight="normal" fill="#1f2933" text-anchor="start" >… and so on until the response is complete: “Let me read cart.py.” plus a tool request, Read(cart.py). The call is over.</text><text x="30.0" y="336.0" font-size="13" font-weight="normal" fill="#5b6770" text-anchor="start" >Within the call, the model keeps its work on earlier tokens (the KV cache), so the input is billed once, not once per token.</text><rect x="30.0" y="350.0" width="840.0" height="50.0" rx="6" fill="#eef3f8" stroke="none" stroke-width="1"/><rect x="44.0" y="360.0" width="14.0" height="14.0" rx="2" fill="#d6e6f5" stroke="#7ea6cc" stroke-width="1"/><text x="66.0" y="372.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="start" >input tokens: everything the agent sent in this call</text><rect x="44.0" y="380.0" width="14.0" height="14.0" rx="2" fill="#e0712c" stroke="none" stroke-width="1"/><text x="66.0" y="392.0" font-size="13" font-weight="600" fill="#1f2933" text-anchor="start" >output tokens: the response the model wrote in this call</text></svg>
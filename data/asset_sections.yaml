industrial:
  blurb: >-
    Dimensioned technical drawings of a synthetic industrial-supply catalog,
    one directory per product type. **Nothing here is a photograph and nothing
    here was generated by a model.** Each drawing is plotted from the attribute
    values of one generated product record by the
    [synthetic-industrial-products](https://github.com/alexander-marquardt/synthetic-industrial-products)
    generator, so it cannot show a dimension the record does not carry — and
    the products it depicts do not exist.


    A file is named for the **image reference** the catalog uses, which is not
    the referencing product's SKU about three times in four, and the directory
    names the product **drawn** rather than the product referencing it. Both
    follow from the reuse the catalog reproduces: one drawing serves many
    records, and the reuse crosses product types.

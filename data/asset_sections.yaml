industrial:
  blurb: >-
    Line drawings of a synthetic industrial-supply catalog, one directory per
    product type. **Nothing here is a photograph and nothing here was generated
    by a model.** Each is plotted from a shape description by the
    [synthetic-industrial-products](https://github.com/alexander-marquardt/synthetic-industrial-products)
    generator, and the products they depict do not exist.


    Each drawing asserts exactly one thing: *this product is a ball nose end
    mill*, *this product is a flat washer*. **None of them carries a dimension,
    a callout, a number or a SKU** — not an estimated one, not a typical one.
    A product's measurements are on its record and render beside the image, so
    a drawing that restated one would be a second source free to disagree with
    the first. These cannot contradict the data they appear against, because
    there is no numeric claim in them to contradict it with.


    That is also why one drawing is shared by a whole family rather than
    belonging to one product, which is what a real supplier's catalog does —
    several sizes of the same end mill are listed against the same picture. So
    a file is named for what it draws, not for any one SKU, and many catalog
    records resolve to the same URL. The directory names the product type
    **drawn**, and holds one file per size the image is displayed at: `card.png`
    for a catalog listing, `detail.png` for a product page.

industrial:
  blurb: >-
    Line drawings of a synthetic industrial-supply catalog, **one per product
    line**, filed under the product type. **Nothing here is a photograph and
    nothing here was generated by a model.** Each is plotted by the
    [synthetic-industrial-products](https://github.com/alexander-marquardt/synthetic-industrial-products)
    generator from the attribute values of a generated product record, and the
    products they depict do not exist.


    **Every visual difference between two of these drawings is a difference
    between two records.** There are ten shapes — a square end mill, a flat
    washer — and what separates one line's drawing from another's is read off
    that line's own published attributes: the outline is its brand's colour,
    the fill is its coating's real colour, the section is hatched for its
    material, the flutes are drawn at the published count and lean the
    published way, and the stamp underneath sets every published value
    verbatim. Nothing is styled from an identifier. A hash of the product id
    would produce exactly as much variety and assert nothing — and a reader who
    sees two mills in different colours concludes the difference is real.


    **None of them carries a dimension, a callout, a measurement or a SKU** —
    not an estimated one, not a typical one. One drawing stands behind a whole
    product line, whose sizes span a median 5.5× range, so a drawing that
    stated a size would be wrong for most of the line it stands behind. A
    product's measurements are on its record and render beside the image, so a
    drawing that restated one would be a second source free to disagree with
    the first. These cannot contradict the data they appear against, because
    there is no measurement in them to contradict it with.


    That is also why the drawing belongs to a product line rather than to one
    SKU, which is what a real supplier's catalog does — several sizes of the
    same end mill are listed against the same picture. So a file is named for
    the line it draws, not for any one SKU, and a line's four to twenty catalog
    records all resolve to the same URL. The directory names the product type,
    then the product line, and holds one file per size the image is displayed
    at: `card.png` for a catalog listing, `detail.png` for a product page. A
    product type's page shows the `card` of every line under it, so a whole
    category can be looked at on one screen; each thumbnail leads to that
    line's own page, where both sizes are.

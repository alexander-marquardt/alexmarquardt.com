{{ define "main" }}
  <article class="post-single">
    <header class="post-header">
      {{ with .Parent }}
        <p class="asset-breadcrumb"><a href="{{ .RelPermalink }}">&larr; {{ .Title }}</a></p>
      {{ end }}
      <h1 class="post-title">{{ .Title }}</h1>
    </header>
    <div class="post-content">
      {{ .Content }}
      {{ partial "asset-gallery.html" . }}
    </div>
  </article>
{{ end }}
